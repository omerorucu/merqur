name: _sync_secret
on:
  workflow_dispatch: {}
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pynacl requests
      - run: python _sync_secret.py
        env:
          DEST_PAT: ${{ secrets.SYNC_PAT }}
          VAL: ${{ secrets.MACOS_CERT_P12_BASE64 }}
